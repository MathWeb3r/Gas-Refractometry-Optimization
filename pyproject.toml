[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gasopt"
version = "0.1.0"
description = "Otimização de refratometria de gases"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
authors = [
  {name = "Matheus Mariano", email = "matheus_mariano@usp.br"},
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "emcee",
    "kneed"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "plotly"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "notebooks*"]

[tool.setuptools.package-data]
gasopt = ["data/*.json"]
